[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundcloud-ma-provider"
version = "0.1.0"
description = "SoundCloud provider for Music Assistant via nuvem_de_som"
requires-python = ">=3.11"
dependencies = ["music-assistant-plugin-manager", "nuvem_de_som"]

[project.entry-points."music_assistant.provider"]
soundcloud_free = "soundcloud_ma_provider"

[tool.setuptools.packages.find]
include = ["soundcloud_ma_provider*"]

[tool.setuptools.package-data]
soundcloud_ma_provider = ["manifest.json"]
